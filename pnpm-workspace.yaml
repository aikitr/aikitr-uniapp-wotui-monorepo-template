packages:
  - 'packages/*'
  - 'apps/*'
  - '!**/test/**'

# 依赖版本目录（pnpm catalog）：统一固定常用依赖的版本。
# 各 package.json 用 "catalog:" 引用，改版本只需在此处改一处，全工作区生效。
catalog:
  # 运行时核心
  vue: ^3.4.21
  dayjs: 1.11.10
  wot-design-uni: ^1.5.0
  # 状态管理 & 路由
  pinia: 2.0.36
  pinia-plugin-persistedstate: 3.2.1
  vue-router: 4.5.1
  # 网络请求
  alova: ^3.3.3
  '@alova/adapter-uniapp': ^2.0.14
  '@alova/shared': ^1.3.1
  # dcloudio 全家桶（必须保持同一版本，否则 H5 / 小程序构建会冲突）
  '@dcloudio/types': ^3.4.8
  '@dcloudio/uni-app': 3.0.0-4070620250821001
  '@dcloudio/uni-components': 3.0.0-4070620250821001
  '@dcloudio/uni-h5': 3.0.0-4070620250821001
  '@dcloudio/uni-mp-weixin': 3.0.0-4070620250821001
  '@dcloudio/vite-plugin-uni': 3.0.0-4070620250821001
  # 构建 & 工具链
  typescript: ~5.8.0
  unocss: 66.0.0
  '@uni-helper/unocss-preset-uni': 0.2.11
  '@uni-helper/uni-types': 1.0.0-alpha.6

overrides:
  unconfig: 7.5.0
# 允许这些依赖在安装时执行 build 脚本（esbuild 等需要）
onlyBuiltDependencies:
  - '@uni-helper/unocss-preset-uni'
  - core-js
  - esbuild
